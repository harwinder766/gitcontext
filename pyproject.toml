[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gitcontext"
version = "0.1.0"
description = "Codebase intelligence and developer copilot powered by RAG"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain-core>=1.6.1",
    "langchain-community>=0.4.2",
    "langchain-postgres>=0.0.19",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=0.3.0",
    "httpx>=0.24.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.52",
    "pydriller>=2.12",
    "PyGithub>=2.0",
    "GitPython>=3.1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.0",
    "logfire>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "streamlit>=1.30.0",
    "requests>=2.28.0",
    "litellm>=1.40.0",
    "langchain-litellm>=0.11.0",
    "deepeval>=4.0.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gitcontext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:.*No logs or spans will be created.*",
]

[tool.ruff]
target-version = "py310"
line-length = 100
